<!doctype html>
<html lang="zxx">

<head>
    <!--========= Required meta tags =========-->
    <meta charset="utf-8">
    <meta http-equiv="x-ua-compatible" content="ie=edge">
    <meta name="description" content="Veilux Network - Login to Privacy Dashboard">
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">

    <title>Veilux Network - Login</title>

    <link rel="shortcut icon" href="assets/img/logo/logo.png" type="images/x-icon"/>

    <!-- css include -->
    <link rel="stylesheet" href="assets/css/bootstrap.min.css">
    <link rel="stylesheet" href="assets/css/fontawesome.css">
    <link rel="stylesheet" href="assets/css/animate.css">
    <link rel="stylesheet" href="assets/css/main.css">
    
    <style>
        .login-page {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: linear-gradient(135deg, #0B0B29 0%, #1D1D3E 100%);
            position: relative;
            overflow: hidden;
        }
        
        .login-page::before {
            content: '';
            position: absolute;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: radial-gradient(circle, rgba(138, 43, 226, 0.1) 0%, transparent 50%);
            animation: rotate 30s linear infinite;
        }
        
        @keyframes rotate {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        
        .login-container {
            position: relative;
            z-index: 1;
            width: 100%;
            max-width: 480px;
            padding: 20px;
        }
        
        .login-box {
            background: rgba(27, 27, 62, 0.9);
            border: 1px solid #2B2B54;
            border-radius: 20px;
            padding: 60px 40px;
            backdrop-filter: blur(10px);
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.5);
        }
        
        .login-logo {
            text-align: center;
            margin-bottom: 40px;
        }
        
        .login-logo img {
            width: 80px;
            height: 80px;
            margin-bottom: 20px;
        }
        
        .login-logo h2 {
            color: #fff;
            font-size: 28px;
            font-weight: 600;
            margin-bottom: 10px;
        }
        
        .login-logo p {
            color: #B3B3C0;
            font-size: 14px;
        }
        
        .form-group {
            margin-bottom: 25px;
        }
        
        .form-group label {
            color: #fff;
            font-size: 14px;
            font-weight: 600;
            margin-bottom: 10px;
            display: block;
        }
        
        .form-control {
            width: 100%;
            height: 55px;
            background: #1D1D3E;
            border: 1px solid #2B2B54;
            border-radius: 10px;
            padding: 0 20px;
            color: #fff;
            font-size: 14px;
            transition: all 0.3s;
        }
        
        .form-control:focus {
            outline: none;
            border-color: #8A2BE2;
            box-shadow: 0 0 0 3px rgba(138, 43, 226, 0.1);
        }
        
        .form-control::placeholder {
            color: #666;
        }
        
        .forgot-password {
            text-align: right;
            margin-top: -10px;
            margin-bottom: 25px;
        }
        
        .forgot-password a {
            color: #8A2BE2;
            font-size: 13px;
            text-decoration: none;
            transition: color 0.3s;
        }
        
        .forgot-password a:hover {
            color: #a855f7;
        }
        
        .login-btn {
            width: 100%;
            height: 55px;
            background: linear-gradient(90deg, #8A2BE2 0%, #a855f7 100%);
            border: none;
            border-radius: 10px;
            color: #fff;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
            position: relative;
            overflow: hidden;
        }
        
        .login-btn::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255,255,255,0.2), transparent);
            transition: left 0.5s;
        }
        
        .login-btn:hover::before {
            left: 100%;
        }
        
        .login-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 30px rgba(138, 43, 226, 0.4);
        }
        
        .login-footer {
            text-align: center;
            margin-top: 30px;
            padding-top: 25px;
            border-top: 1px solid #2B2B54;
        }
        
        .login-footer p {
            color: #B3B3C0;
            font-size: 14px;
            margin-bottom: 0;
        }
        
        .login-footer a {
            color: #8A2BE2;
            text-decoration: none;
            font-weight: 600;
        }
        
        .login-footer a:hover {
            color: #a855f7;
        }
        
        .back-home {
            position: absolute;
            top: 30px;
            left: 30px;
            z-index: 10;
        }
        
        .back-home a {
            display: flex;
            align-items: center;
            gap: 10px;
            color: #fff;
            text-decoration: none;
            font-size: 14px;
            font-weight: 600;
            transition: color 0.3s;
        }
        
        .back-home a:hover {
            color: #8A2BE2;
        }
        
        .back-home i {
            font-size: 20px;
        }
        
        @media (max-width: 576px) {
            .login-box {
                padding: 40px 25px;
            }
            
            .back-home {
                top: 20px;
                left: 20px;
            }
        }
    </style>
</head>

<body>
    <div class="login-page">
        <div class="back-home">
            <a href="index.html">
                <i class="fas fa-arrow-left"></i>
                <span>Back to Home</span>
            </a>
        </div>
        
        <div class="login-container">
            <div class="login-box">
                <div class="login-logo">
                    <img src="assets/img/logo/logo.png" alt="Veilux">
                    <h2>Welcome Back</h2>
                    <p>Login to your Veilux Privacy Dashboard</p>
                </div>
                
                <form id="loginForm" onsubmit="handleLogin(event)">
                    <div class="form-group">
                        <label for="email">Email / Wallet Address</label>
                        <input type="text" class="form-control" id="email" placeholder="Enter your email or wallet address" required>
                    </div>
                    
                    <div class="form-group">
                        <label for="password">Password</label>
                        <input type="password" class="form-control" id="password" placeholder="Enter your password" required>
                    </div>
                    
                    <div class="forgot-password">
                        <a href="javascript:void(0);">Forgot Password?</a>
                    </div>
                    
                    <button type="submit" class="login-btn">
                        Login to Dashboard
                    </button>
                    
                    <div class="login-footer">
                        <p>Don't have an account? <a href="javascript:void(0);">Sign Up</a></p>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <script>
        function handleLogin(event) {
            event.preventDefault();
            
            // Show loading state
            const btn = event.target.querySelector('.login-btn');
            const originalText = btn.textContent;
            btn.textContent = 'Authenticating...';
            btn.disabled = true;
            
            // Simulate login process and redirect to dashboard
            setTimeout(() => {
                window.location.href = 'dashboard.html';
            }, 1000);
        }
    </script>
</body>

</html>
